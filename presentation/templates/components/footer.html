<footer class="mx-auto w-full max-w-[1040px] px-3 sm:px-5">
    <div class="flex flex-col gap-4 pt-14 pb-16 text-sm text-zinc-600 sm:flex-row sm:items-center sm:justify-between">
        <nav aria-label="Footer">
            <ul role="list" class="-mx-2 flex flex-wrap">
                {% for link in crate::navigation::NAVIGATION_LINKS %}
                <li><a href="{{ link.path }}" class="flex min-h-11 items-center rounded-lg px-2 hover:text-zinc-900">{{ link.label }}</a></li>
                {% endfor %}
            </ul>
        </nav>
        <p>&copy; {{ crate::current_year() }} nunomaduro</p>
    </div>
</footer>
