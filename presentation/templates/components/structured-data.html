<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {% include "components/person.html" %},
    {% include "components/website.html" %},
    {
      "@type": "{% if page.id() == "about" %}ProfilePage{% else if page.id() == "posts" || page.id() == "talks" %}CollectionPage{% else %}WebPage{% endif %}",
      "@id": "https://nunomaduro.com{{ url }}#webpage",
      "url": "https://nunomaduro.com{{ url }}",
      "name": {{ page.title()|json|safe }},
      "description": {{ page.description()|json|safe }},
      "inLanguage": "en-US",
      "isPartOf": { "@id": "https://nunomaduro.com/#website" },
      {% if page.id() == "about" %}"mainEntity": { "@id": "https://nunomaduro.com/#person" },{% else %}"about": { "@id": "https://nunomaduro.com/#person" },
      "breadcrumb": {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://nunomaduro.com/" },
          { "@type": "ListItem", "position": 2, "name": "{{ page.id()|capitalize }}", "item": "https://nunomaduro.com{{ url }}" }
        ]
      },{% endif %}
      "primaryImageOfPage": {
        "@type": "ImageObject",
        "url": "https://nunomaduro.com/og/{{ page.id() }}.png",
        "width": 1200,
        "height": 630
      }
    }
  ]
}
</script>
