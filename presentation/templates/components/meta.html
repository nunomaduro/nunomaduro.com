<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title() }}</title>
<meta name="description" content="{{ page.description() }}">
<meta name="author" content="nunomaduro">
<meta name="theme-color" content="#f2f2f4">
<meta name="format-detection" content="telephone=no">
{% if page.id() == "not-found" %}
<meta name="robots" content="noindex, follow">
{% else %}
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<link rel="canonical" href="https://nunomaduro.com{{ url }}">
{% endif %}

<meta property="og:site_name" content="nunomaduro">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="https://nunomaduro.com{{ url }}">
<meta property="og:description" content="{{ page.description() }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@enunomaduro">
<meta name="twitter:creator" content="@enunomaduro">
<meta name="twitter:description" content="{{ page.description() }}">
<meta name="fediverse:creator" content="@nunomaduro@mastodon.social">

<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="nunomaduro">

<link rel="alternate" type="application/rss+xml" title="nunomaduro · Posts" href="https://nunomaduro.com/feed.xml">
