{% extends "layouts/post.html" %}

{% block page %}
    <article class="card mx-auto max-w-[704px] px-5 py-8 sm:px-12 sm:py-14 lg:px-16">
        <div class="mb-8 flex items-center justify-between gap-4 text-sm text-zinc-600 sm:mb-10">
            <a href="/posts" class="-ml-2 inline-flex min-h-11 items-center rounded-lg px-2 hover:text-zinc-900"><span aria-hidden="true">&larr;&nbsp;</span>posts</a>
            <time datetime="{{ page.published_at().iso8601() }}">{{ page.published_at() }}</time>
        </div>

        <h1 class="text-[30px] leading-[1.1] font-bold tracking-[-0.035em] text-balance sm:text-[40px]">{{ page.heading() }}</h1>
        <p class="mt-4 mb-10 border-b border-zinc-200 pb-8 text-[17px] leading-normal text-pretty text-zinc-600 sm:text-[19px]">{{ page.description() }}</p>

        <div class="prose">
            {{ content|safe }}
        </div>

        <footer class="mt-12 rounded-2xl bg-canvas px-5 py-[18px] text-[15px] text-zinc-600">
            <p class="text-pretty">thanks for reading. subscribe to my <a href="https://youtube.com/@nunomaduro" class="link whitespace-nowrap">youtube channel</a> and to the <a href="/feed.xml" class="link whitespace-nowrap">rss feed</a> for more.</p>
        </footer>
    </article>
{% endblock %}
