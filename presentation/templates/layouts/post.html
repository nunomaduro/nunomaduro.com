<!DOCTYPE html>
<html lang="en">
    <head>
        {% include "components/meta.html" %}

        <!-- OG Image for this post -->
        <meta property="og:image" content="https://nunomaduro.com/og/{{ page.slug() }}.png">
        <meta property="og:image:secure_url" content="https://nunomaduro.com/og/{{ page.slug() }}.png">
        <meta property="og:image:type" content="image/png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="{{ page.heading() }}">
        <meta name="twitter:image" content="https://nunomaduro.com/og/{{ page.slug() }}.png">
        <meta name="twitter:image:alt" content="{{ page.heading() }}">

        {% include "components/styles.html" %}
        <link rel="preload" href="/dist/fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
        {% include "components/scripts.html" %}

        <!-- BlogPosting Structured Data -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "BlogPosting",
          "@id": "https://nunomaduro.com{{ url }}#article",
          "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "https://nunomaduro.com{{ url }}"
          },
          "headline": "{{ page.title() }}",
          "description": "{{ page.description() }}",
          "image": "https://nunomaduro.com/og/{{ page.slug() }}.png",
          "author": {
            "@type": "Person",
            "@id": "https://nunomaduro.com/#person",
            "name": "nunomaduro",
            "url": "https://nunomaduro.com"
          },
          "publisher": {
            "@type": "Person",
            "@id": "https://nunomaduro.com/#person",
            "name": "nunomaduro",
            "url": "https://nunomaduro.com"
          },
          "datePublished": "{{ page.published_at() }}",
          "dateModified": "{{ page.published_at() }}",
          "inLanguage": "en-US"
        }
        </script>

        <!-- BreadcrumbList for Blog Post -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://nunomaduro.com"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Posts",
              "item": "https://nunomaduro.com/posts"
            },
            {
              "@type": "ListItem",
              "position": 3,
              "name": "{{ page.title() }}",
              "item": "https://nunomaduro.com{{ url }}"
            }
          ]
        }
        </script>
    </head>
    <body class="flex min-h-dvh flex-col bg-canvas font-sans text-zinc-900 antialiased">
        {% block navigation %}
            {% include "components/navigation.html" %}
        {% endblock %}

        <main id="content" tabindex="-1" class="mx-auto w-full max-w-[1040px] flex-1 px-3 pt-8 focus:outline-none sm:px-5 sm:pt-10">
            {% block page %}

            {% endblock %}
        </main>

        {% include "components/footer.html" %}
    </body>
</html>
