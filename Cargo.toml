[package]
name = "nunomaduro_com"
version = "1.0.0"
edition = "2021"
default-run = "server"

[workspace]
members = [
    "application",
    "domain",
    "infrastructure",
    "presentation",
]

[dependencies]
application = { path = "application" }

hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
tokio = { version = "1.54.1", features = ["full"] }
dotenvy = "0.15.7"
